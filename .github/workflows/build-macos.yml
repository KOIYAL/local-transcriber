name: Build macOS app

# Cloud Mac build (no local Mac needed): compiles the Apple Intelligence
# helper, the PyInstaller backend, and the Electron app, then creates the
# DMG via build-macos.sh. Signing and notarization switch on automatically
# once the corresponding secrets exist; without them the artifact is an
# unsigned test build. See docs/CLOUD-MAC-BUILD.md for the secrets.

on:
  workflow_dispatch:
    inputs:
      compare_release:
        description: "Also check a published DMG (release tag, e.g. v0.7.0) for comparison"
        required: false
        default: ""
  push:
    tags: ["v*"]

jobs:
  build:
    runs-on: macos-26 # Apple Silicon; Xcode 26 = FoundationModels SDK
    timeout-minutes: 90
    env:
      # llama-cpp-python is built from source here (the runner has Xcode +
      # CMake, and Metal is enabled by default on Apple Silicon). The
      # prebuilt-wheel indexes serve occasionally corrupt files (BadZipFile
      # on install), so they are deliberately not used.
      MAC_CERT_P12_BASE64: ${{ secrets.MAC_CERT_P12_BASE64 }}
      APPLE_API_KEY_P8_BASE64: ${{ secrets.APPLE_API_KEY_P8_BASE64 }}
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Run the test suite
        run: |
          python3 -m venv .venv
          .venv/bin/python -m pip install --disable-pip-version-check -e ".[dev]"
          .venv/bin/python -m pytest

      # The modelshelf fallback engine, from the public modelshelf release.
      - name: Fetch the modelshelf fallback binary
        run: |
          set -euo pipefail
          mkdir -p vendor
          curl -fL --retry 3 \
            https://github.com/KOIYAL/modelshelf/releases/latest/download/modelshelf-macos-arm64 \
            -o vendor/modelshelf
          chmod +x vendor/modelshelf
          vendor/modelshelf --version

      - name: Import the signing certificate
        if: ${{ env.MAC_CERT_P12_BASE64 != '' }}
        env:
          MAC_CERT_PASSWORD: ${{ secrets.MAC_CERT_PASSWORD }}
        run: |
          set -euo pipefail
          KEYCHAIN_PASSWORD=$(uuidgen)
          echo "$MAC_CERT_P12_BASE64" | base64 --decode > "$RUNNER_TEMP/cert.p12"
          security create-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security default-keychain -s build.keychain
          security unlock-keychain -p "$KEYCHAIN_PASSWORD" build.keychain
          security set-keychain-settings -lut 3600 build.keychain
          security import "$RUNNER_TEMP/cert.p12" -k build.keychain \
            -P "$MAC_CERT_PASSWORD" -T /usr/bin/codesign
          security set-key-partition-list -S apple-tool:,apple: \
            -s -k "$KEYCHAIN_PASSWORD" build.keychain >/dev/null
          rm "$RUNNER_TEMP/cert.p12"

      - name: Configure notarization credentials
        if: ${{ env.APPLE_API_KEY_P8_BASE64 != '' }}
        env:
          APPLE_API_KEY_ID: ${{ secrets.APPLE_API_KEY_ID }}
          APPLE_API_ISSUER_ID: ${{ secrets.APPLE_API_ISSUER_ID }}
        run: |
          set -euo pipefail
          echo "$APPLE_API_KEY_P8_BASE64" | base64 --decode > "$RUNNER_TEMP/notary-key.p8"
          xcrun notarytool store-credentials ci-notary \
            --key "$RUNNER_TEMP/notary-key.p8" \
            --key-id "$APPLE_API_KEY_ID" \
            --issuer "$APPLE_API_ISSUER_ID"
          rm "$RUNNER_TEMP/notary-key.p8"
          echo "MAC_NOTARY_PROFILE=ci-notary" >> "$GITHUB_ENV"

      - name: Build the app and DMG
        env:
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
        run: ./build-macos.sh

      # What a user's Mac sees after downloading: the app inside the DMG must
      # carry an intact signature. Unsigned builds are ad-hoc signed, so
      # Gatekeeper rejects them as "unidentified developer" (allowed via
      # System Settings), never as "damaged".
      - name: Check the DMG as macOS sees it
        env:
          GH_TOKEN: ${{ github.token }}
          COMPARE_RELEASE: ${{ inputs.compare_release }}
        run: |
          set -uo pipefail
          check_dmg() {
            local dmg="$1" mnt app
            mnt="$(mktemp -d)"
            hdiutil attach -nobrowse -readonly -mountpoint "$mnt" "$dmg" >/dev/null
            app="$(mktemp -d)/LocalTranscriber.app"
            ditto "$mnt/LocalTranscriber.app" "$app"
            hdiutil detach "$mnt" >/dev/null
            xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" "$app"
            echo "== $dmg"
            codesign -dv "$app" 2>&1 | grep -E "Signature|Authority|TeamIdentifier" || true
            codesign --verify --deep --strict --verbose=2 "$app"; local verify=$?
            spctl --assess --type execute -vv "$app" 2>&1 || true
            # Start the bundled backend the way the app does and wait for it.
            local be="$app/Contents/Resources/local-transcriber-backend/local-transcriber-backend" up=1
            LT_UPDATE_CHECK=off "$be" --port 18911 > "$RUNNER_TEMP/backend.log" 2>&1 &
            local pid=$!
            for _ in $(seq 1 60); do
              if curl -fs http://127.0.0.1:18911/api/health >/dev/null; then up=0; break; fi
              kill -0 "$pid" 2>/dev/null || break
              sleep 1
            done
            kill "$pid" 2>/dev/null || true
            if [ "$up" -eq 0 ]; then echo "backend: started"; else echo "backend: FAILED to start"; tail -20 "$RUNNER_TEMP/backend.log"; fi
            return $(( verify || up ))
          }
          # Hide the build output so links that still point at it would fail,
          # exactly as on a user's Mac.
          mv dist/backend-macos "$RUNNER_TEMP/backend-macos-hidden"
          check_dmg dist/LocalTranscriber-macOS-*.dmg || { echo "::error::The built app is broken (signature or backend start)"; exit 1; }
          if [ -n "$COMPARE_RELEASE" ]; then
            gh release download "$COMPARE_RELEASE" --repo "$GITHUB_REPOSITORY" \
              --pattern 'LocalTranscriber-macOS-*.dmg' --dir "$RUNNER_TEMP/published"
            check_dmg "$RUNNER_TEMP"/published/*.dmg || echo "::warning::Published $COMPARE_RELEASE DMG fails (signature or backend start)"
          fi

      # Visual check of the drag-to-Applications window (best effort: the
      # runner may not allow screen capture).
      - name: Screenshot the DMG window
        continue-on-error: true
        run: |
          set -euo pipefail
          # Mark the DMG like a browser download, so the shortcut inside is
          # opened under the same conditions as on a user's Mac.
          cp dist/LocalTranscriber-macOS-*.dmg "$RUNNER_TEMP/downloaded.dmg"
          xattr -w com.apple.quarantine "0081;$(printf '%x' "$(date +%s)");Safari;" "$RUNNER_TEMP/downloaded.dmg"
          hdiutil attach "$RUNNER_TEMP/downloaded.dmg" >/dev/null
          open "/Volumes/Local Transcriber"
          sleep 6
          screencapture -x "$RUNNER_TEMP/dmg-window.png"
          # The Privacy & Security shortcut should open System Settings at the
          # Security section.
          open "/Volumes/Local Transcriber/セキュリティ設定を開く.webloc"
          sleep 8
          screencapture -x "$RUNNER_TEMP/settings-opened.png"
          pgrep -lf "System Settings" || echo "System Settings is not running"
          osascript -e 'tell application "System Settings" to quit' || true
          hdiutil detach "/Volumes/Local Transcriber" >/dev/null || true

      - uses: actions/upload-artifact@v4
        continue-on-error: true
        with:
          name: dmg-window-screenshot
          path: |
            ${{ runner.temp }}/dmg-window.png
            ${{ runner.temp }}/settings-opened.png
          if-no-files-found: ignore

      - uses: actions/upload-artifact@v4
        with:
          name: LocalTranscriber-macOS-arm64
          path: dist/LocalTranscriber-macOS-*.dmg
          if-no-files-found: error

      - name: Build summary
        run: |
          {
            echo "## macOS build"
            if [ -n "${MAC_CODESIGN_IDENTITY:-}" ]; then
              echo "- Signed: yes"
            else
              echo "- Signed: **no** (test build; set the MAC_CERT_* secrets)"
            fi
            if [ -n "${MAC_NOTARY_PROFILE:-}" ]; then
              echo "- Notarized: yes"
            else
              echo "- Notarized: **no** (set the APPLE_API_* secrets)"
            fi
            if [ -f vendor/modelshelf ]; then
              echo "- Local-LLM fallback engine: bundled"
            else
              echo "- Local-LLM fallback engine: **not bundled** (Apple Intelligence only)"
            fi
          } >> "$GITHUB_STEP_SUMMARY"
        env:
          MAC_CODESIGN_IDENTITY: ${{ secrets.MAC_CODESIGN_IDENTITY }}
