name: Build Windows app

# Cloud Windows build (no local Windows checkout needed): creates the venv,
# fetches the public modelshelf.exe, then runs build-windows.cmd to produce
# the portable zip and, when Store identity variables are configured, an
# unsigned MSIX. Artifacts are not published to Releases or the Store.

on:
  workflow_dispatch:
  push:
    tags: ["v*"]

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest
    timeout-minutes: 90
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Create virtual environment
        shell: cmd
        run: python -m venv .venv

      - name: Fetch modelshelf.exe
        shell: cmd
        run: |
          mkdir vendor
          curl -fL https://github.com/KOIYAL/modelshelf/releases/latest/download/modelshelf-windows-x64.exe -o vendor\modelshelf.exe

      - name: Build portable app
        shell: cmd
        run: build-windows.cmd

      - name: Upload portable zip
        uses: actions/upload-artifact@v4
        with:
          name: LocalTranscriber-win-x64
          path: dist/LocalTranscriber-*-win-x64.zip
          if-no-files-found: error

      - name: Check Store package configuration
        id: store
        shell: pwsh
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PACKAGE_VERSION: ${{ vars.STORE_PACKAGE_VERSION }}
        run: |
          $required = 'STORE_IDENTITY_NAME', 'STORE_PUBLISHER', 'STORE_PACKAGE_VERSION'
          $missing = @($required | Where-Object {
            [string]::IsNullOrWhiteSpace([Environment]::GetEnvironmentVariable($_))
          })
          if ($missing.Count -gt 0) {
            $message = 'MSIX skipped: configure repository variables ' + ($missing -join ', ') + '. See STORE_SUBMISSION.md.'
            Write-Output "::notice::$message"
            $message >> $env:GITHUB_STEP_SUMMARY
            'enabled=false' >> $env:GITHUB_OUTPUT
          } else {
            'enabled=true' >> $env:GITHUB_OUTPUT
          }

      - name: Build unsigned Store MSIX
        if: steps.store.outputs.enabled == 'true'
        shell: cmd
        env:
          STORE_IDENTITY_NAME: ${{ vars.STORE_IDENTITY_NAME }}
          STORE_PUBLISHER: ${{ vars.STORE_PUBLISHER }}
          STORE_PACKAGE_VERSION: ${{ vars.STORE_PACKAGE_VERSION }}
          SIGNING_CERT: ""
        run: package-msix.cmd

      - name: Upload Store MSIX
        if: steps.store.outputs.enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: LocalTranscriber-msix
          path: dist/KOIYAL-Transcriber-Store.msix
          if-no-files-found: error
