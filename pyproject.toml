[build-system]
requires = ["setuptools>=75", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "local-transcriber"
version = "0.7.2"
description = "Private, on-device audio and video transcription with local-LLM summaries."
readme = "README.md"
license = { text = "AGPL-3.0-only" }
requires-python = ">=3.10"
dependencies = [
    "fastapi>=0.115,<1",
    "faster-whisper>=1.1,<2",
    # PyAV 19 removed av.open(metadata_errors=...), which faster-whisper 1.2.1
    # still passes when decoding a file, so every transcription failed with
    # "open() got an unexpected keyword argument 'metadata_errors'".
    "av>=11,<19",
    "python-multipart>=0.0.20,<1",
    "uvicorn[standard]>=0.34,<1",
]

[project.optional-dependencies]
dev = [
    "httpx>=0.28,<1",
    "pytest>=8,<9",
]
summary = [
    "llama-cpp-python>=0.3,<0.5",
]
diarize = [
    "sherpa-onnx>=1.13.8,<2",
]
desktop = [
    "pyinstaller>=6.14,<7",
]
assets = [
    "pillow>=10,<13",
]

[tool.setuptools.packages.find]
include = ["app*"]

[tool.setuptools.package-data]
app = ["static/*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"
